name: Build RoadLog APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the build files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create package.json and Capacitor config
        run: |
          echo '{"name":"roadlog","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.0.0","@capacitor/core":"^6.0.0","@capacitor/share":"^6.0.0","@capacitor/filesystem":"^6.0.0","@capacitor-community/background-geolocation":"^1.2.0","@capacitor-community/speech-recognition":"^6.0.0"},"devDependencies":{"@capacitor/cli":"^6.0.0"}}' > package.json
          echo '{"appId":"com.lourens.roadlog","appName":"RoadLog","webDir":"www"}' > capacitor.config.json

      - name: Build Web Assets & App Logic
        run: |
          mkdir -p www

          # 1. Native Bridge met GPS, Floating Overlay & Bestuursgedrag Monitor
          cat << 'EOF' > www/native-bridge.js
          (function() {
            try {
              if (!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
              
              var registerPlugin = window.Capacitor.registerPlugin;
              var BG = registerPlugin('BackgroundGeolocation');
              var Speech = registerPlugin('SpeechRecognition');
              var Share = registerPlugin('Share');
              var Filesystem = registerPlugin('Filesystem');

              window.RoadLogState = {
                activeDestination: null,
                isTracking: false,
                currentSpeed: 0,
                gForce: 0,
                visitedPlaces: []
              };

              // Monitor foon se accelerometer vir "dryf" / rystyl (G-kragte)
              if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', function(event) {
                  var acc = event.accelerationIncludingGravity;
                  if (acc) {
                    var x = acc.x || 0;
                    var y = acc.y || 0;
                    var totalAcc = Math.sqrt(x*x + y*y);
                    // Standardiseer g-krag
                    window.RoadLogState.gForce = (totalAcc / 9.81).toFixed(2);
                    
                    var gEl = document.getElementById('overlay-gforce');
                    if (gEl) gEl.innerText = window.RoadLogState.gForce + ' G';
                  }
                });
              }

              // Stel bestemming in (Jy beheer dit self!)
              window.setDestination = function(destinationName) {
                if (!destinationName || !destinationName.trim()) return;
                window.RoadLogState.activeDestination = destinationName.trim();
                window.RoadLogState.isTracking = true;
                
                var destEl = document.getElementById('overlay-dest');
                if (destEl) destEl.innerText = destinationName;
                
                alert('Bestemming gestel na: ' + destinationName + '\nSpanning en spoed word nou dopgehou.');
              };

              // GPS Tracking met Spoed en Arriveer-deteksie vir gekose bestemming
              BG.addWatcher({
                backgroundMessage: "RoadLog hou jou rit dop bo-oor ander apps.",
                backgroundTitle: "RoadLog Actief",
                requestPermissions: true,
                stale: false,
                distanceFilter: 5
              }, function(location, err) {
                if (err || !location) return;

                var speedKmh = location.speed ? Math.round(location.speed * 3.6) : 0;
                window.RoadLogState.currentSpeed = speedKmh;

                // Opdateer Floating Overlay Skermpie
                var speedEl = document.getElementById('overlay-speed');
                if (speedEl) speedEl.innerText = speedKmh + ' km/h';

                // As jy stop (0 km/h) EN jy het 'n bestemming ingestel, stoor hy die plek!
                if (speedKmh === 0 && window.RoadLogState.isTracking && window.RoadLogState.activeDestination) {
                  var dest = window.RoadLogState.activeDestination;
                  
                  // Stoor op die kaart/logboek
                  window.RoadLogState.visitedPlaces.push({
                    name: dest,
                    lat: location.latitude,
                    lng: location.longitude,
                    time: new Date().toISOString()
                  });

                  if (window.addMapMarker) {
                    window.addMapMarker(location.latitude, location.longitude, dest);
                  }

                  alert('Arriveer by bestemming: ' + dest + '!\nPlek is outomaties op jou kaart gemerk en gestoor.');
                  
                  // Reset bestemming-dophou totdat jy die volgende plek insit
                  window.RoadLogState.isTracking = false;
                  window.RoadLogState.activeDestination = null;
                  var destEl = document.getElementById('overlay-dest');
                  if (destEl) destEl.innerText = 'Geen bestemming';
                }
              });

              // Stemtipering vir bestemming
              window.dictateDestination = function() {
                Speech.requestPermissions().then(function() {
                  return Speech.start({ language: 'af-ZA', maxResults: 1, prompt: 'Praat die pleknaam', popup: true });
                }).then(function(res) {
                  if (res && res.matches && res.matches.length) {
                    var inputEl = document.getElementById('dest-input');
                    if (inputEl) inputEl.value = res.matches[0];
                    window.setDestination(res.matches[0]);
                  }
                }).catch(function(e) { console.log(e); });
              };

            } catch (e) {
              console.warn('Native bridge fout:', e);
            }
          })();
          EOF

          # 2. Skep die App Koofskerm HTML & Floating Overlay UI
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="af">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>RoadLog</title>
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
            <style>
              body { font-family: sans-serif; margin: 0; padding: 15px; background: #f4f6f8; }
              .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
              input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
              button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
              #map { height: 250px; width: 100%; border-radius: 8px; margin-top: 10px; }
              
              /* Floating Overlay Skermpie Styl */
              #floating-overlay {
                position: fixed;
                top: 20px;
                right: 20px;
                width: 140px;
                background: rgba(0, 0, 0, 0.85);
                color: #fff;
                padding: 10px;
                border-radius: 12px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.5);
                z-index: 999999;
                font-size: 12px;
                text-align: center;
                border: 2px solid #007bff;
              }
              .speed-val { font-size: 22px; font-weight: bold; color: #00ffcc; }
              .dest-val { font-size: 11px; color: #ffcc00; margin-top: 4px; font-weight: bold; }
            </style>
          </head>
          <body>

            <!-- Klein Floating Overlay Skermpie wat bo-oor ander apps wys -->
            <div id="floating-overlay">
              <div style="font-size: 10px; opacity: 0.8;">SPOED</div>
              <div id="overlay-speed" class="speed-val">0 km/h</div>
              <div style="font-size: 10px; opacity: 0.8; margin-top: 5px;">BESTUURSGEDRAG</div>
              <div id="overlay-gforce" style="font-weight:bold;">1.00 G</div>
              <div class="dest-val" id="overlay-dest">Geen bestemming</div>
            </div>

            <h2>RoadLog Dashboard</h2>

            <div class="card">
              <h3>1. Stel jou Bestemming In</h3>
              <p style="font-size:13px; color:#666;">Voer die plek in waartoe jy ry. Die app sal die plek net stoor wanneer jy daar arriveer.</p>
              <input type="text" id="dest-input" placeholder="bv. Sejen">
              <button onclick="window.setDestination(document.getElementById('dest-input').value)">Stel Bestemming</button>
              <button onclick="window.dictateDestination()" style="background:#28a745; margin-top:5px;">🎤 Praat Bestemming</button>
            </div>

            <div class="card">
              <h3>2. Jou Gemerkte Plekke vir die Jaar</h3>
              <div id="map"></div>
            </div>

            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
            <script src="native-bridge.js"></script>
            <script>
              // Leaflet Kaart Inisialisering
              var map = L.map('map').setView([-26.1951, 28.0340], 10);
              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: 'OpenStreetMap'
              }).addTo(map);

              window.addMapMarker = function(lat, lng, title) {
                L.marker([lat, lng]).addTo(map)
                  .bindPopup('<b>' + title + '</b>')
                  .openPopup();
                map.setView([lat, lng], 13);
              };
            </script>
          </body>
          </html>
          EOF

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm install
          npx cap add android

      - name: Configure Android Permissions for Overlay & GPS
        run: |
          # Voeg permisies by vir Floating Window bo-oor ander apps en GPS
          PERMS="<uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\" />\n<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n<uses-permission android:name=\"android.permission.ACCESS_BACKGROUND_LOCATION\" />"
          sed -i "/<\/manifest>/i $PERMS" android/app/src/main/AndroidManifest.xml
          
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadlog-release-apk
          path: android/app/build/outputs/apk/release/*.apk
